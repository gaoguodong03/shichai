<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 480 360" fill="none" aria-hidden="true">
  <defs>
    <linearGradient id="loginHeroSky" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#e8f0fe"/>
      <stop offset="100%" stop-color="#f2f2f7"/>
    </linearGradient>
    <linearGradient id="loginHeroFlame" x1="0.5" y1="0" x2="0.5" y2="1">
      <stop offset="0%" stop-color="#ffb347"/>
      <stop offset="55%" stop-color="#ff9500"/>
      <stop offset="100%" stop-color="#ff6b35"/>
    </linearGradient>
  </defs>
  <rect width="480" height="360" rx="24" fill="url(#loginHeroSky)"/>
  <!-- ground -->
  <ellipse cx="240" cy="300" rx="200" ry="28" fill="#d1d1d6" opacity="0.45"/>
  <!-- wood pile -->
  <g transform="translate(88 248)">
    <rect x="0" y="8" width="56" height="10" rx="2" fill="#8e8e93" transform="rotate(-8 28 13)"/>
    <rect x="12" y="0" width="52" height="10" rx="2" fill="#aeaeb2" transform="rotate(6 38 5)"/>
    <rect x="4" y="16" width="48" height="9" rx="2" fill="#c7c7cc" transform="rotate(3 28 20)"/>
  </g>
  <!-- campfire logs -->
  <g transform="translate(200 268)">
    <rect x="-4" y="0" width="72" height="12" rx="3" fill="#6d4c41" transform="rotate(-18)"/>
    <rect x="8" y="4" width="68" height="11" rx="3" fill="#8d6e63" transform="rotate(12)"/>
  </g>
  <!-- flame -->
  <path d="M232 268c-8-18-4-32 8-44 6 12 18 18 24 30 4-10 14-16 20-26 10 14 12 32 4 48-8 14-24 22-40 20-8-2-14-16-16-28z" fill="url(#loginHeroFlame)"/>
  <path d="M236 272c4-12 12-20 20-26 2 10-2 22-10 30-6 6-14 8-22 6-4-8 4-18 12-10z" fill="#fff5e6" opacity="0.85"/>
  <!-- person left (carrying bundle) -->
  <g transform="translate(118 168)">
    <ellipse cx="22" cy="88" rx="20" ry="6" fill="#c6c6c8" opacity="0.5"/>
    <path d="M12 78c-4-28 8-52 28-56 16-2 26 12 28 28 2 14-4 28-16 34l-4 18h-12l-6-20c-8-4-14-12-18-24z" fill="#007aff"/>
    <circle cx="32" cy="28" r="14" fill="#ffd4b8"/>
    <path d="M4 52h20l8 12-6 8H8l-4-20z" fill="#0051d5"/>
    <rect x="-8" y="40" width="36" height="14" rx="3" fill="#5856d6" transform="rotate(-25 10 47)"/>
    <rect x="0" y="44" width="32" height="12" rx="2" fill="#6e6ce0" transform="rotate(-25 16 50)"/>
  </g>
  <!-- person right (tending fire) -->
  <g transform="translate(300 162)">
    <ellipse cx="24" cy="94" rx="20" ry="6" fill="#c6c6c8" opacity="0.5"/>
    <path d="M8 84c2-30 18-50 36-48 14 2 22 18 20 36-2 14-12 26-24 30l2 20h-14l-8-22c-10-6-14-18-12-32z" fill="#34c759"/>
    <circle cx="28" cy="26" r="14" fill="#ffd4b8"/>
    <path d="M36 48l16 8-4 12-20-8 8-12z" fill="#248a3d"/>
  </g>
  <!-- decorative sparks -->
  <circle cx="260" cy="200" r="3" fill="#ff9500" opacity="0.85"/>
  <circle cx="228" cy="188" r="2" fill="#007aff" opacity="0.5"/>
  <circle cx="248" cy="176" r="2.5" fill="#ff6b35" opacity="0.7"/>
  <path d="M320 120l6 10-10-4 4 10-8-8-2 12-4-12-8 8 4-10-10 4 6-10h12z" fill="#007aff" opacity="0.25"/>
</svg>
