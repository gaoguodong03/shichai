# 专家协作平台一键运行：前后端一体镜像
# 使用：docker compose up -d
# 访问：http://localhost:8000
#
# 默认挂载本地 backend/data、backend/config；技能在 data/users/<用户>/skills。
# 与 Dockerfile 一致：容器内路径为 /app/backend/data、/app/backend/config（与 1Panel 命名卷挂到 /app/backend/data 一致）。
# 远程若用 compose + 命名卷：volumes 写「- st49:/app/backend/data」，并增加：
# volumes: { st49: { external: true } }  （卷需已在 Docker 中创建，如 1Panel 建的 st49）

services:
  opensandbox-server:
    image: opensandbox/server:latest
    container_name: opensandbox-server
    ports:
      # OpenSandbox server 内部默认 8090；宿主映射到 8091，避免与本项目 8000 冲突
      - "8091:8090"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # OpenSandbox docker runtime 需要访问宿主 docker.sock
      - /var/run/docker.sock:/var/run/docker.sock
      - ./opensandbox/config.toml:/etc/opensandbox/config.toml:ro
    environment:
      - SANDBOX_CONFIG_PATH=/etc/opensandbox/config.toml
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read(); sys.exit(0)"]
      interval: 5s
      timeout: 3s
      retries: 20
      start_period: 10s
    restart: unless-stopped

  dha:
    build:
      context: .
      platforms:
        - linux/amd64
      args:
        NODE_IMAGE: ${NODE_IMAGE:-node:20-bookworm-slim}
        PYTHON_IMAGE: ${PYTHON_IMAGE:-python:3.12-slim}
    image: dha:latest
    platform: linux/amd64
    container_name: dha
    ports:
      - "8000:8000"
    environment:
      - CORS_ORIGINS=http://localhost:8000,http://127.0.0.1:8000
      # 强制 OpenSandbox：容器内通过服务名访问 lifecycle API（8090）
      - OPENSANDBOX_DOMAIN=opensandbox-server:8090
      - OPENSANDBOX_PROTOCOL=http
      - UNIFIED_TOOL_GATEWAY_ENABLED=1
      - OPENSANDBOX_USE_SERVER_PROXY=1
      - SANDBOX_BASE_IMAGE=python:3.12
      # OpenSandbox 的 host_path 挂载需要“宿主机可见路径”。本地用 bind mount 时，/app/backend/data 实际就在当前项目目录下。
      - SANDBOX_HOST_PATH_MAP=/app/backend/data=${PWD}/backend/data,/app/backend/config=${PWD}/backend/config
      - SKILL_SCRIPT_TIMEOUT=300
      # 与 1Panel 编排一致：默认禁网 + 按工具放行（run_skill_script 含全部 run_skill_script_<skill_id>）
      - SANDBOX_ALLOW_NETWORK=0
      - SANDBOX_NETWORK_TOOL_ALLOWLIST=run_skill_script
      - SANDBOX_ALLOWED_HOSTS=
      - SANDBOX_SCRIPT_GATEWAY_SLACK_MS=300000
      # MCP_CONFIG_PATH / APP_SETTINGS_PATH / SESSIONS_DIR / AGENT_OUTPUTS_DIR 使用镜像内 ENV（/app/backend/...）
    depends_on:
      opensandbox-server:
        condition: service_healthy
    volumes:
      # 与本地 / 远程持久化一致：用户数据与各用户 skills
      - ./backend/data:/app/backend/data
      - ./backend/config:/app/backend/config
      # 调试模式：将宿主机 .cursor 挂载到与代码中日志路径一致的位置，便于收集容器内 MCP 日志
      - ./.cursor:/Users/ggd/mycode/DHA/.cursor
    # 从宿主机 backend/.env 注入 QWEN_API_KEY 等（文件需存在，否则聊天会 500）
    env_file:
      - backend/.env
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped
