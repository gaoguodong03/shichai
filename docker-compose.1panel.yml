services:
  opensandbox-server:
    image: "${OPENSANDBOX_SERVER_IMAGE:-opensandbox/server:v0.1.13}"
    container_name: opensandbox-server
    network_mode: bridge
    ports:
      - "${OPENSANDBOX_HOST_PORT:-8091}:8090"
    env_file:
      - path: ./.env
        required: false
      - path: ./backend/.env
        required: false
    environment:
      # OpenSandbox 新版本要求显式配置 api_key，或在内网/本机部署时显式确认无 key 风险。
      # 生产环境建议在 .env 中设置 OPENSANDBOX_API_KEY；未设置时用该开关避免服务启动被阻断。
      - OPENSANDBOX_INSECURE_SERVER=${OPENSANDBOX_INSECURE_SERVER:-YES}
      # OpenSandbox 新版本默认拒绝所有 host bind mounts；这里放行工作区/技能所在数据根目录。
      - OPENSANDBOX_ALLOWED_HOST_PATHS=${OPENSANDBOX_ALLOWED_HOST_PATHS:-/Users/ggd/project/shichai/backend/data,/var/lib/docker/volumes/st49/_data}
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    extra_hosts:
      - "host.docker.internal:host-gateway"
    entrypoint:
      - /bin/sh
      - -lc
    command:
      - |
        # Compose 会展开单层环境变量；用 $$ 把默认值交给容器内 shell，避免未设置时变成空串导致 unhealthy
        # OpenSandbox execd 镜像必须包含 /execd 运行时工件；不要改成业务沙箱镜像。
        # 业务脚本运行镜像由 st49 创建沙箱时通过 image_ref/SANDBOX_STANDARD_IMAGE 传给 OpenSandbox。
        export OPENSANDBOX_EXECD_IMAGE="$${OPENSANDBOX_EXECD_IMAGE:-opensandbox/execd:v1.0.15}"
        export OPENSANDBOX_EGRESS_IMAGE="$${OPENSANDBOX_EGRESS_IMAGE:-opensandbox/egress:v1.0.10}"
        export OPENSANDBOX_ALLOWED_HOST_PATHS="$${OPENSANDBOX_ALLOWED_HOST_PATHS:-/Users/ggd/project/shichai/backend/data,/var/lib/docker/volumes/st49/_data}"
        allowed_host_paths=""
        old_ifs="$$IFS"
        IFS=,
        for p in $$OPENSANDBOX_ALLOWED_HOST_PATHS; do
          p="$$(printf '%s' "$$p" | sed 's/^ *//;s/ *$$//')"
          [ -z "$$p" ] && continue
          p="$$(printf '%s' "$$p" | sed 's/\\/\\\\/g;s/"/\\"/g')"
          if [ -z "$$allowed_host_paths" ]; then
            allowed_host_paths="\"$$p\""
          else
            allowed_host_paths="$$allowed_host_paths, \"$$p\""
          fi
        done
        IFS="$$old_ifs"
        cat > /tmp/sandbox.toml <<EOF
        [server]
        host = "0.0.0.0"
        port = 8090
        log_level = "INFO"
        eip = "host.docker.internal"
        api_key = "$${OPENSANDBOX_API_KEY:-}"

        [runtime]
        type = "docker"
        execd_image = "$${OPENSANDBOX_EXECD_IMAGE}"

        [egress]
        image = "$${OPENSANDBOX_EGRESS_IMAGE}"

        [storage]
        allowed_host_paths = [$$allowed_host_paths]

        [docker]
        network_mode = "bridge"
        api_timeout = 1200
        host_ip = "host.docker.internal"
        pids_limit = 4096

        [ingress]
        mode = "direct"
        EOF
        /bin/cat /tmp/sandbox.toml
        exec /app/.venv/bin/opensandbox-server --config /tmp/sandbox.toml
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request,sys; urllib.request.urlopen('http://127.0.0.1:8090/health', timeout=2).read(); sys.exit(0)",
        ]
      interval: 5s
      timeout: 3s
      retries: 30
      start_period: 20s
    restart: unless-stopped

  st49:
    image: "${ST49_IMAGE:-crpi-hzqv5l81v3ftz5jl.cn-beijing.personal.cr.aliyuncs.com/free4inno-yuanfang2025/dha:26.05.12.7}"
    container_name: st49
    ports:
      - "${ST49_HOST_PORT:-8100}:8000"
    env_file:
      - path: ./.env
        required: false
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://127.0.0.1:8100}
      - AUTH_SECRET=${AUTH_SECRET:-please_change_to_a_long_random_secret}
      # 方案 B：st49 通过宿主机端口访问 OpenSandbox；OpenSandbox 与其创建的沙箱同处默认 bridge，避免 server proxy 连不上 172.17.x.x:44772。
      - OPENSANDBOX_DOMAIN=host.docker.internal:${OPENSANDBOX_HOST_PORT:-8091}
      - OPENSANDBOX_PROTOCOL=http
      - UNIFIED_TOOL_GATEWAY_ENABLED=1
      - OPENSANDBOX_USE_SERVER_PROXY=0
      - OPENSANDBOX_REQUEST_TIMEOUT_SEC=${OPENSANDBOX_REQUEST_TIMEOUT_SEC:-900}
      # 沙箱镜像：用户可在“设置 → 沙箱”选择普通版或 Playwright 版；未单独配置时沿用 SANDBOX_BASE_IMAGE。
      - SANDBOX_BASE_IMAGE=${ST49_SANDBOX_STANDARD_IMAGE:-crpi-hzqv5l81v3ftz5jl.cn-beijing.personal.cr.aliyuncs.com/free4inno-yuanfang2025/sandbox:26.05.12.1-standard}
      - SANDBOX_STANDARD_IMAGE=${ST49_SANDBOX_STANDARD_IMAGE:-crpi-hzqv5l81v3ftz5jl.cn-beijing.personal.cr.aliyuncs.com/free4inno-yuanfang2025/sandbox:26.05.12.1-standard}
      - SANDBOX_PLAYWRIGHT_IMAGE=${ST49_SANDBOX_PLAYWRIGHT_IMAGE:-crpi-hzqv5l81v3ftz5jl.cn-beijing.personal.cr.aliyuncs.com/free4inno-yuanfang2025/sandbox:26.05.12.1-playwright}
      # 音频转写 Skill：服务地址、模型和 API Key 固定在技能脚本内；这里只控制长音频切片与超时。
      - QWEN_AUDIO_CHUNK_SECONDS=${QWEN_AUDIO_CHUNK_SECONDS:-120}
      - QWEN_AUDIO_REQUEST_TIMEOUT_SEC=${QWEN_AUDIO_REQUEST_TIMEOUT_SEC:-0}
      - PLAYWRIGHT_BROWSERS_PATH=${PLAYWRIGHT_BROWSERS_PATH:-/ms-playwright}
      - SANDBOX_HOST_PATH_MAP=/app/backend/data=/var/lib/docker/volumes/st49/_data
      - SKILL_SCRIPT_TIMEOUT=600
      # 沙箱网络（推荐：默认禁网 + 按工具放行）
      - SANDBOX_ALLOW_NETWORK=0
      # 仅允许这些工具的沙箱请求出网（逗号分隔；写 * 表示全放开）。写 run_skill_script 即包含全部 run_skill_script_<skill_id>
      - SANDBOX_NETWORK_TOOL_ALLOWLIST=run_skill_script
      # 可选：只放行特定域名（逗号分隔）。留空表示不做域名收紧（由 OpenSandbox 网络策略决定）。
      # 示例（GitHub）：github.com,raw.githubusercontent.com,api.github.com
      - SANDBOX_ALLOWED_HOSTS=
      # 网关 asyncio 等待整段沙箱执行（建容器/首次 pip/跑脚本）；默认在脚本超时基础上 +600s，见 SANDBOX_SCRIPT_GATEWAY_SLACK_MS
      - SANDBOX_SCRIPT_GATEWAY_SLACK_MS=${SANDBOX_SCRIPT_GATEWAY_SLACK_MS:-600000}
      # 沙箱常驻与统一资源（可在 1Panel 编排/环境变量中覆盖，无需改本文件）
      - SANDBOX_ALWAYS_ON=${SANDBOX_ALWAYS_ON:-1}
      - SANDBOX_PREWARM_ALL_USERS=${SANDBOX_PREWARM_ALL_USERS:-1}
      - SANDBOX_RESTART_ONLY_ON_REQUIREMENTS_UPDATE=${SANDBOX_RESTART_ONLY_ON_REQUIREMENTS_UPDATE:-1}
      - SANDBOX_FIXED_CPU=${SANDBOX_FIXED_CPU:-1.0}
      - SANDBOX_FIXED_MEMORY_MB=${SANDBOX_FIXED_MEMORY_MB:-2048}
      - SANDBOX_MAX_CONCURRENT_TASKS_PER_USER=${SANDBOX_MAX_CONCURRENT_TASKS_PER_USER:-4}
      # 技能执行 Agent 限流（避免长时间循环“看起来没反应”）
      - SKILL_AGENT_MAX_STEPS=${SKILL_AGENT_MAX_STEPS:-6}
      - SKILL_AGENT_MAX_REPEATED_TOOL_ROUNDS=${SKILL_AGENT_MAX_REPEATED_TOOL_ROUNDS:-2}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    depends_on:
      opensandbox-server:
        condition: service_healthy
    volumes:
      - st49_data:/app/backend/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://127.0.0.1:8000/health"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 15s
    restart: unless-stopped

volumes:
  st49_data:
    name: st49
    external: true
